<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .photo { fill: #f8cecc; stroke: #b85450; }
      .tag-blue { fill: #dae8fc; stroke: #6c8ebf; }
      .tag-green { fill: #d5e8d4; stroke: #82b366; }
      .tag-yellow { fill: #fff2cc; stroke: #d6b656; }
      .line { fill: none; stroke: #333; stroke-width: 1.2; }
      .arrow { marker-end: url(#arrow); }
      .code { font-family: Menlo, Consolas, monospace; font-size: 12px; }
      text { fill: #222; }
    </style>
  </defs>
  <rect width="900" height="620" fill="#fff"/>

  <!-- Left notes -->
  <rect class="tag-green" x="30" y="40" width="200" height="26" rx="3"/>
  <text x="130" y="58" text-anchor="middle">No scroll math needed</text>
  <text x="30" y="90">The browser tells us when the</text>
  <text x="30" y="107">sentinel gets close to the screen.</text>

  <rect class="tag-yellow" x="30" y="400" width="200" height="26" rx="3"/>
  <text x="130" y="418" text-anchor="middle" class="code">#scroll-sentinel</text>
  <text x="30" y="450">Empty &lt;div&gt; placed right after</text>
  <text x="30" y="467">the image container, so it is</text>
  <text x="30" y="484">always at the end of the content.</text>

  <!-- Photos (page content) -->
  <rect class="photo" x="290" y="60" width="160" height="70"/>
  <rect class="photo" x="290" y="150" width="160" height="70"/>
  <rect class="photo" x="290" y="240" width="160" height="70"/>
  <rect class="photo" x="290" y="330" width="160" height="70"/>
  <rect class="photo" x="290" y="420" width="160" height="70"/>

  <!-- Sentinel -->
  <rect x="290" y="505" width="160" height="10" fill="#fff2cc" stroke="#d6b656" stroke-dasharray="4 3"/>
  <path class="line arrow" d="M232,413 C260,413 260,510 288,510"/>

  <!-- Viewport -->
  <rect x="260" y="30" width="220" height="340" rx="22" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- rootMargin zone below the viewport -->
  <rect x="260" y="370" width="220" height="190" fill="#dae8fc" fill-opacity="0.35" stroke="#6c8ebf" stroke-dasharray="6 4"/>

  <!-- Right brackets and labels -->
  <path class="line" d="M500,30 H510 V370 H500"/>
  <rect class="tag-blue" x="530" y="50" width="160" height="26" rx="3"/>
  <text x="610" y="68" text-anchor="middle">Viewport</text>
  <text x="530" y="98">What the user currently sees</text>

  <path class="line" d="M500,372 H510 V560 H500"/>
  <rect class="tag-blue" x="530" y="380" width="290" height="26" rx="3"/>
  <text x="675" y="398" text-anchor="middle" class="code">rootMargin: '0px 0px 1000px 0px'</text>
  <text x="530" y="428">The observed zone is stretched 1000px</text>
  <text x="530" y="445">below the viewport (any value works).</text>

  <rect class="tag-yellow" x="530" y="475" width="330" height="70" rx="6"/>
  <text x="545" y="497">Sentinel enters the zone</text>
  <text x="545" y="515" class="code">→ entry.isIntersecting === true</text>
  <text x="545" y="533" class="code">→ loadMorePhotos()</text>
  <path class="line arrow" d="M528,510 H455"/>

  <text x="260" y="595" font-size="12" fill="#555">New photos push the sentinel down; it is observed again, ready for the next batch.</text>
</svg>
