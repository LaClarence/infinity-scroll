<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite loop</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Unsplash API - Infinite Scroll</h1>
    <!-- Theme search, stays at the top while scrolling -->
    <form class="search" id="search-form">
        <input type="search" id="search-input" placeholder="Search a theme (e.g. mountains) and press Enter"
            aria-label="Photo theme" autocomplete="off">
        <p class="current-theme" id="current-theme">Random photos</p>
    </form>
    <!-- Loader -->
    <div class="loader" id="loader">
        <img src="loader.svg" alt="loading">
    </div>
    <!-- Image container -->
    <div class="image-container" id="image-container"></div>
    <!-- Message shown when no photo matches or loading fails -->
    <p class="status" id="status" hidden></p>
    <!-- Sentinel watched by IntersectionObserver to load more photos -->
    <div id="scroll-sentinel"></div>
    <!-- Script -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
